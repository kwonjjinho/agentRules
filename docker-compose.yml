version: '3.8'

services:
  # ============================================================================
  # 1. RDBMS: PostgreSQL 16 (딜 서비스 DB: deal_db)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: msa-postgres
    environment:
      POSTGRES_DB: deal_db
      POSTGRES_USER: deal_user
      POSTGRES_PASSWORD: deal_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deal_user -d deal_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - msa-network

  # ============================================================================
  # 1-1. RDBMS: PostgreSQL 16 (결제 서비스 DB: payment_db, Database-per-Service)
  # ============================================================================
  payment-postgres:
    image: postgres:16-alpine
    container_name: msa-payment-postgres
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password
    ports:
      - "5433:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - msa-network

  # ============================================================================
  # 1-2. RDBMS: PostgreSQL 16 (인증 서비스 DB: auth_db, Database-per-Service)
  # ============================================================================
  auth-postgres:
    image: postgres:16-alpine
    container_name: msa-auth-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5434:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - msa-network

  # ============================================================================
  # 2. In-Memory: Redis 7 (Redisson 분산 락 & 실시간 캐시 & JWT 블랙리스트)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: msa-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - msa-network

  # ============================================================================
  # 3. Message Broker: Apache Kafka & Zookeeper (CloudEvents 1.0 EDA)
  # ============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: msa-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - msa-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: msa-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - msa-network

  # ============================================================================
  # 4. Service Registry: Netflix Eureka Discovery Server (Java 21)
  # ============================================================================
  discovery-service:
    build:
      context: ./discovery-service
      dockerfile: Dockerfile
    container_name: msa-discovery-service
    ports:
      - "8761:8761"
    environment:
      EUREKA_USERNAME: eureka
      EUREKA_PASSWORD: eureka1234!
      EUREKA_HOST: discovery-service
    networks:
      - msa-network

  # ============================================================================
  # 5. API Gateway: Spring Cloud Gateway & JWT Token Relay (Java 21)
  # ============================================================================
  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: msa-gateway-service
    depends_on:
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      EUREKA_SERVER_URL: http://eureka:eureka1234!@discovery-service:8761/eureka/
      JWT_SECRET: "EnterpriseGradeSiliconValleySecretKeyMustBeAtLeast256BitsLongForHmacSha256!"
    networks:
      - msa-network

  # ============================================================================
  # 6. Backend: Deal Microservice (Spring Boot 3.x, Java 21)
  # ============================================================================
  deal-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msa-deal-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-service:
        condition: service_started
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deal_db
      SPRING_DATASOURCE_USERNAME: deal_user
      SPRING_DATASOURCE_PASSWORD: deal_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:eureka1234!@discovery-service:8761/eureka/
    networks:
      - msa-network

  # ============================================================================
  # 6-1. Backend: Payment Microservice (Spring Boot 3.x, Java 21)
  # ============================================================================
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: msa-payment-service
    depends_on:
      payment-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-service:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: payment_user
      SPRING_DATASOURCE_PASSWORD: payment_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:eureka1234!@discovery-service:8761/eureka/
    networks:
      - msa-network

  # ============================================================================
  # 6-2. Backend: Auth Microservice (Spring Boot 3.x, Java 21)
  # ============================================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: msa-auth-service
    depends_on:
      auth-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: "EnterpriseGradeSiliconValleySecretKeyMustBeAtLeast256BitsLongForHmacSha256!"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:eureka1234!@discovery-service:8761/eureka/
    networks:
      - msa-network

  # ============================================================================
  # 7. Frontend: Next.js 14/15 App Router & BFF
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: msa-frontend
    depends_on:
      - gateway-service
    ports:
      - "3000:3000"
    environment:
      INTERNAL_GATEWAY_URL: http://gateway-service:8080
      NODE_ENV: production
    networks:
      - msa-network

networks:
  msa-network:
    driver: bridge

volumes:
  postgres_data:
  payment_postgres_data:
  auth_postgres_data:
  redis_data:
