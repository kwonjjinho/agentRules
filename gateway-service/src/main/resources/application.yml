server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        # Deal Service Routes
        - id: deal-service-deals
          uri: lb://deal-service
          predicates:
            - Path=/api/v1/deals/**
          filters:
            - name: JwtAuthenticationFilter
              args:
                whiteListUrls:
                  - "/api/v1/deals"          # deal 목록 조회 (공개 가능)
                  - "/api/v1/deals/active"   # 활성 deal 목록 조회 (공개 가능)
                  - "/api/v1/deals/{dealId}" # deal 상세 조회 (공개 가능)
                  - "/api/v1/deals/{dealId}/stream" # 실시간 SSE 스트림 조회

        # Payment Service Routes (Requires JWT Authentication & Header Relay)
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: JwtAuthenticationFilter

        # Auth / Public routes can be bypassed without JWT filter
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

jwt:
  # Minimum 256-bit secret key for HMAC-SHA256 signature verification
  secret: ${JWT_SECRET:EnterpriseGradeSiliconValleySecretKeyMustBeAtLeast256BitsLongForHmacSha256!}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
