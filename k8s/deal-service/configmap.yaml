apiVersion: v1
kind: ConfigMap
metadata:
  name: deal-service-config
  namespace: default
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_SHUTDOWN: "graceful"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.default.svc.cluster.local:5432/deal_db"
  SPRING_REDIS_HOST: "redis.default.svc.cluster.local"
  SPRING_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka.default.svc.cluster.local:9092"
